<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='700' viewBox='0 0 1000 700'><rect width='1000' height='700' fill='#ffffff'/><defs><pattern id='ha' width='7' height='7' patternTransform='rotate(-45)' patternUnits='userSpaceOnUse'><rect width='7' height='7' fill='#e9e5db'/><line x1='0' y1='0' x2='0' y2='7' stroke='#b9b09b' stroke-width='1'/></pattern><pattern id='hs' width='6' height='6' patternTransform='rotate(45)' patternUnits='userSpaceOnUse'><rect width='6' height='6' fill='#d3d9de'/><line x1='0' y1='0' x2='0' y2='6' stroke='#8d969e' stroke-width='1.1'/></pattern></defs><text x='30.0' y='42.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='21' fill='#14171b' text-anchor='start' font-weight='600'>Re-proportioning the plate - same 8 mm total, much more air</text><text x='30.0' y='66.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#6f7680' text-anchor='start' font-weight='400'>Cut across the fin channels, with the ring at the left for reference. Scale 20:1. Overall height does not change - only the split between web and duct.</text><rect x='130.0' y='220' width='44.0' height='160.0' fill='url(#hs)' stroke='#14171b' stroke-width='1.4'/><rect x='130.0' y='250.0' width='44.0' height='100.0' fill='#eef4f8' stroke='#14171b' stroke-width='1.4'/><text x='130.0' y='398.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' fill='#6f7680' text-anchor='start' font-weight='400'>ring, vent 5.0 tall</text><rect x='190' y='220' width='180.0' height='80.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.5'/><rect x='210.0' y='120.0' width='32.0' height='100.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.3'/><rect x='318.0' y='120.0' width='32.0' height='100.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.3'/><rect x='190' y='300.0' width='180.0' height='60.0' fill='#ffffff' stroke='#14171b' stroke-width='1.3'/><rect x='200.0' y='300.0' width='20.0' height='60.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.1'/><rect x='280.0' y='300.0' width='20.0' height='60.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.1'/><rect x='190' y='360.0' width='180.0' height='20.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.5'/><line x1='404.0' y1='220.0' x2='404.0' y2='300.0' stroke='#a3781a' stroke-width='1'/><line x1='400.0' y1='220.0' x2='408.0' y2='220.0' stroke='#a3781a' stroke-width='1'/><line x1='400.0' y1='300.0' x2='408.0' y2='300.0' stroke='#a3781a' stroke-width='1'/><text x='396.0' y='264.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#a3781a' text-anchor='end' font-weight='400'>web 4.0</text><line x1='404.0' y1='300.0' x2='404.0' y2='360.0' stroke='#a3781a' stroke-width='1'/><line x1='400.0' y1='300.0' x2='408.0' y2='300.0' stroke='#a3781a' stroke-width='1'/><line x1='400.0' y1='360.0' x2='408.0' y2='360.0' stroke='#a3781a' stroke-width='1'/><text x='396.0' y='334.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#a3781a' text-anchor='end' font-weight='400'>duct 3.0</text><line x1='404.0' y1='360.0' x2='404.0' y2='380.0' stroke='#6f7680' stroke-width='1'/><line x1='400.0' y1='360.0' x2='408.0' y2='360.0' stroke='#6f7680' stroke-width='1'/><line x1='400.0' y1='380.0' x2='408.0' y2='380.0' stroke='#6f7680' stroke-width='1'/><text x='396.0' y='374.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6f7680' text-anchor='end' font-weight='400'>1.0</text><text x='130.0' y='432.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13.5' fill='#a3781a' text-anchor='start' font-weight='700'>NOW   web 4.0 / duct 3.0</text><text x='130.0' y='454.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>channel 3.0 x 3.0 = 9 mm2</text><text x='130.0' y='473.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>fin surface 9 mm per mm of run</text><text x='130.0' y='492.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>about 41 Pa across the plate</text><rect x='580.0' y='220' width='44.0' height='160.0' fill='url(#hs)' stroke='#14171b' stroke-width='1.4'/><rect x='580.0' y='250.0' width='44.0' height='100.0' fill='#eef4f8' stroke='#14171b' stroke-width='1.4'/><text x='580.0' y='398.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' fill='#6f7680' text-anchor='start' font-weight='400'>ring, vent 5.0 tall</text><rect x='640' y='220' width='180.0' height='40.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.5'/><rect x='660.0' y='120.0' width='32.0' height='100.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.3'/><rect x='768.0' y='120.0' width='32.0' height='100.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.3'/><rect x='708.0' y='160.0' width='48.0' height='60.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.3'/><rect x='724.0' y='168.0' width='16.0' height='84.0' fill='#ffffff' stroke='#2e7d4f' stroke-width='1.5'/><rect x='640' y='260.0' width='180.0' height='100.0' fill='#ffffff' stroke='#14171b' stroke-width='1.3'/><rect x='650.0' y='260.0' width='20.0' height='100.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.1'/><rect x='730.0' y='260.0' width='20.0' height='100.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.1'/><rect x='640' y='360.0' width='180.0' height='20.0' fill='url(#ha)' stroke='#14171b' stroke-width='1.5'/><line x1='854.0' y1='220.0' x2='854.0' y2='260.0' stroke='#2e7d4f' stroke-width='1'/><line x1='850.0' y1='220.0' x2='858.0' y2='220.0' stroke='#2e7d4f' stroke-width='1'/><line x1='850.0' y1='260.0' x2='858.0' y2='260.0' stroke='#2e7d4f' stroke-width='1'/><text x='846.0' y='244.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#2e7d4f' text-anchor='end' font-weight='400'>web 2.0</text><line x1='854.0' y1='260.0' x2='854.0' y2='360.0' stroke='#2e7d4f' stroke-width='1'/><line x1='850.0' y1='260.0' x2='858.0' y2='260.0' stroke='#2e7d4f' stroke-width='1'/><line x1='850.0' y1='360.0' x2='858.0' y2='360.0' stroke='#2e7d4f' stroke-width='1'/><text x='846.0' y='314.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#2e7d4f' text-anchor='end' font-weight='400'>duct 5.0</text><line x1='854.0' y1='360.0' x2='854.0' y2='380.0' stroke='#6f7680' stroke-width='1'/><line x1='850.0' y1='360.0' x2='858.0' y2='360.0' stroke='#6f7680' stroke-width='1'/><line x1='850.0' y1='380.0' x2='858.0' y2='380.0' stroke='#6f7680' stroke-width='1'/><text x='846.0' y='374.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6f7680' text-anchor='end' font-weight='400'>1.0</text><text x='580.0' y='432.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13.5' fill='#2e7d4f' text-anchor='start' font-weight='700'>PROPOSED   web 2.0 / duct 5.0</text><text x='580.0' y='454.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>channel 3.0 x 5.0 = 15 mm2   (+67 percent)</text><text x='580.0' y='473.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>fin surface 13 mm per mm of run   (+44 percent)</text><text x='580.0' y='492.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>about 16 Pa, or 8 with fins over the hot spots only</text><text x='190.0' y='116.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6f7680' text-anchor='start' font-weight='400'>existing top ribs</text><text x='640.0' y='100.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#2e7d4f' text-anchor='start' font-weight='400'>ribs restore the stiffness</text><text x='772.0' y='150.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#2e7d4f' text-anchor='start' font-weight='400'>boss - 5 mm of thread,</text><text x='772.0' y='164.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#2e7d4f' text-anchor='start' font-weight='400'>only where a screw lands</text><line x1='30' y1='510' x2='970' y2='510' stroke='#c6ccd3' stroke-width='1'/><text x='30.0' y='542.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' fill='#14171b' text-anchor='start' font-weight='600'>What it costs</text><rect x='30' y='559' width='4' height='23' fill='#2e7d4f'/><text x='46.0' y='572.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#14171b' text-anchor='start' font-weight='700'>Bending stiffness</text><text x='200.0' y='572.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>4 mm to 2 mm is eight times less stiff</text><text x='500.0' y='572.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#2e7d4f' text-anchor='start' font-weight='400'>ribs already fix this - stiffness follows rib height, and ten are in the design</text><rect x='30' y='591' width='4' height='23' fill='#a3781a'/><text x='46.0' y='604.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#14171b' text-anchor='start' font-weight='700'>Thread engagement</text><text x='200.0' y='604.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>2 mm is under one screw diameter</text><text x='500.0' y='604.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#a3781a' text-anchor='start' font-weight='400'>local 5 mm bosses where screws land. This is the real constraint, not stiffness.</text><rect x='30' y='623' width='4' height='23' fill='#a3781a'/><text x='46.0' y='636.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#14171b' text-anchor='start' font-weight='700'>Heat spreading</text><text x='200.0' y='636.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>the web spreads heat sideways to the fins</text><text x='500.0' y='636.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#a3781a' text-anchor='start' font-weight='400'>halving it doubles that resistance - about 1.4 K more on the CM5. Acceptable.</text><rect x='30' y='655' width='4' height='23' fill='#2e7d4f'/><text x='46.0' y='668.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#14171b' text-anchor='start' font-weight='700'>Height</text><text x='200.0' y='668.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>2 + 5 + 1 is still 8 mm</text><text x='500.0' y='668.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#2e7d4f' text-anchor='start' font-weight='400'>nothing is given up</text></svg>