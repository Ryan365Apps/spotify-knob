='254' stroke='#b3341f' stroke-width='4'/><line x1='204' y1='206' x2='156' y2='254' stroke='#b3341f' stroke-width='4'/><text x='180.0' y='376.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#14171b' text-anchor='middle' font-weight='700'>1. Radial fins</text><text x='180.0' y='396.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#b3341f' text-anchor='middle' font-weight='600'>Wrong for this flow</text><text x='180.0' y='414.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#6f7680' text-anchor='middle' font-weight='400'>Air enters at the rim and leaves at the rim, so it</text><text x='180.0' y='430.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#6f7680' text-anchor='middle' font-weight='400'>travels front to back. Radial fins sit across that.</text><circle cx='500' cy='230' r='98' fill='#dfe3e7' stroke='#98a1a9' stroke-width='2'/><circle cx='500' cy='230' r='82' fill='#ece8de' stroke='#b9b09b' stroke-width='1'/><line x1='401.0' y1='230.0' x2='401.0' y2='230.0' stroke='#a89f8a' stroke-width='2'/><line x1='410.0' y1='230.0' x2='410.0' y2='230.0' stroke='#a89f8a' stroke-width='2'/><line x1='419.0' y1='217.2' x2='419.0' y2='242.8' stroke='#a89f8a' stroke-width='2'/><line x1='428.0' y1='190.8' x2='428.0' y2='269.2' stroke='#a89f8a' stroke-width='2'/><line x1='437.0' y1='177.5' x2='437.0' y2='282.5' stroke='#a89f8a' stroke-width='2'/><line x1='446.0' y1='168.3' x2='446.0' y2='291.7' stroke='#a89f8a' stroke-width='2'/><line x1='455.0' y1='161.5' x2='455.0' y2='298.5' stroke='#a89f8a' stroke-width='2'/><line x1='464.0' y1='156.3' x2='464.0' y2='303.7' stroke='#a89f8a' stroke-width='2'/><line x1='473.0' y1='152.6' x2='473.0' y2='307.4' stroke='#a89f8a' stroke-width='2'/><line x1='482.0' y1='150.0' x2='482.0' y2='310.0' stroke='#a89f8a' stroke-width='2'/><line x1='491.0' y1='148.5' x2='491.0' y2='311.5' stroke='#a89f8a' stroke-width='2'/><line x1='500.0' y1='148.0' x2='500.0' y2='312.0' stroke='#a89f8a' stroke-width='2'/><line x1='509.0' y1='148.5' x2='509.0' y2='311.5' stroke='#a89f8a' stroke-width='2'/><line x1='518.0' y1='150.0' x2='518.0' y2='310.0' stroke='#a89f8a' stroke-width='2'/><line x1='527.0' y1='152.6' x2='527.0' y2='307.4' stroke='#a89f8a' stroke-width='2'/><line x1='536.0' y1='156.3' x2='536.0' y2='303.7' stroke='#a89f8a' stroke-width='2'/><line x1='545.0' y1='161.5' x2='545.0' y2='298.5' stroke='#a89f8a' stroke-width='2'/><line x1='554.0' y1='168.3' x2='554.0' y2='291.7' stroke='#a89f8a' stroke-width='2'/><line x1='563.0' y1='177.5' x2='563.0' y2='282.5' stroke='#a89f8a' stroke-width='2'/><line x1='572.0' y1='190.8' x2='572.0' y2='269.2' stroke='#a89f8a' stroke-width='2'/><line x1='581.0' y1='217.2' x2='581.0' y2='242.8' stroke='#a89f8a' stroke-width='2'/><line x1='590.0' y1='230.0' x2='590.0' y2='230.0' stroke='#a89f8a' stroke-width='2'/><line x1='599.0' y1='230.0' x2='599.0' y2='230.0' stroke='#a89f8a' stroke-width='2'/><line x1='448' y1='114' x2='448' y2='138' stroke='#2f6f9e' stroke-width='2.6' marker-end='url(#fc)'/><line x1='448' y1='322' x2='448' y2='346' stroke='#c0522d' stroke-width='2.6' marker-end='url(#fw)'/><line x1='500' y1='114' x2='500' y2='138' stroke='#2f6f9e' stroke-width='2.6' marker-end='url(#fc)'/><line x1='500' y1='322' x2='500' y2='346' stroke='#c0522d' stroke-width='2.6' marker-end='url(#fw)'/><line x1='552' y1='114' x2='552' y2='138' stroke='#2f6f9e' stroke-width='2.6' marker-end='url(#fc)'/><line x1='552' y1='322' x2='552' y2='346' stroke='#c0522d' stroke-width='2.6' marker-end='url(#fw)'/><text x='500.0' y='376.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#14171b' text-anchor='middle' font-weight='700'>2. Front to back, as built</text><text x='500.0' y='396.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#a3781a' text-anchor='middle' font-weight='600'>About 41 Pa</text><text x='500.0' y='414.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#6f7680' text-anchor='middle' font-weight='400'>Right direction, and already what the model does -</text><text x='500.0' y='430.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#6f7680' text-anchor='middle' font-weight='400'>but only 3 mm tall, so 19 channels of 9 mm2.</text><circle cx='820' cy='230' r='98' fill='#dfe3e7' stroke='#98a1a9' stroke-width='2'/><circle cx='820' cy='230' r='82' fill='#ece8de' stroke='#b9b09b' stroke-width='1'/><line x1='766.0' y1='185.7' x2='766.0' y2='228.4' stroke='#8a7f66' stroke-width='3'/><line x1='775.0' y1='185.7' x2='775.0' y2='228.4' stroke='#8a7f66' stroke-width='3'/><line x1='784.0' y1='185.7' x2='784.0' y2='228.4' stroke='#8a7f66' stroke-width='3'/><line x1='793.0' y1='185.7' x2='793.0' y2='228.4' stroke='#8a7f66' stroke-width='3'/><line x1='802.0' y1='185.7' x2='802.0' y2='228.4' stroke='#8a7f66' stroke-width='3'/><line x1='811.0' y1='185.7' x2='811.0' y2='228.4' stroke='#8a7f66' stroke-width='3'/><line x1='829.0' y1='239.0' x2='829.0' y2='273.5' stroke='#8a7f66' stroke-width='3'/><line x1='838.0' y1='239.0' x2='838.0' y2='273.5' stroke='#8a7f66' stroke-width='3'/><line x1='847.0' y1='239.0' x2='847.0' y2='273.5' stroke='#8a7f66' stroke-width='3'/><line x1='856.0' y1='239.0' x2='856.0' y2='273.5' stroke='#8a7f66' stroke-width='3'/><line x1='865.0' y1='239.0' x2='865.0' y2='273.5' stroke='#8a7f66' stroke-width='3'/><rect x='765.1' y='185.7' width='50.8' height='42.6' fill='none' stroke='#c0522d' stroke-width='1.4' stroke-dasharray='4 3' rx='6'/><rect x='827.4' y='239.0' width='41.0' height='34.4' fill='none' stroke='#c0522d' stroke-width='1.4' stroke-dasharray='4 3' rx='6'/><text x='820.0' y='280.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6f7680' text-anchor='middle' font-weight='400'>open cavity</text><text x='820.0' y='294.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='9.5' fill='#6f7680' text-anchor='middle' font-weight='400'>almost no resistance</text><line x1='768' y1='114' x2='768' y2='138' stroke='#2f6f9e' stroke-width='2.6' marker-end='url(#fc)'/><line x1='768' y1='322' x2='768' y2='346' stroke='#c0522d' stroke-width='2.6' marker-end='url(#fw)'/><line x1='820' y1='114' x2='820' y2='138' stroke='#2f6f9e' stroke-width='2.6' marker-end='url(#fc)'/><line x1='820' y1='322' x2='820' y2='346' stroke='#c0522d' stroke-width='2.6' marker-end='url(#fw)'/><line x1='872' y1='114' x2='872' y2='138' stroke='#2f6f9e' stroke-width='2.6' marker-end='url(#fc)'/><line x1='872' y1='322' x2='872' y2='346' stroke='#c0522d' stroke-width='2.6' marker-end='url(#fw)'/><text x='820.0' y='376.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' fill='#14171b' text-anchor='middle' font-weight='700'>3. Same fins, 5 mm duct, hot spots only</text><text x='820.0' y='396.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#2e7d4f' text-anchor='middle' font-weight='600'>About 8 Pa</text><text x='820.0' y='414.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#6f7680' text-anchor='middle' font-weight='400'>Deeper channels, and open cavity between the finned</text><text x='820.0' y='430.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#6f7680' text-anchor='middle' font-weight='400'>zones. Same 19 channels, same direction.</text><line x1='30' y1='440' x2='970' y2='440' stroke='#c6ccd3' stroke-width='1'/><text x='30.0' y='474.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='16' fill='#14171b' text-anchor='start' font-weight='600'>Where the exhaust actually goes, given the ports</text><text x='30.0' y='498.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#6f7680' text-anchor='start' font-weight='400'>The rear cannot supply an exhaust equal to the intake - the port face leaves about 88 degrees of usable arc. It does not need to: 400 mm2 is enough.</text><circle cx='210' cy='660' r='110' fill='#dfe3e7' stroke='#98a1a9' stroke-width='2'/><circle cx='210' cy='660' r='94' fill='#ece8de' stroke='#b9b09b' stroke-width='1'/><path d='M 106.1 720.0 A 120 120 0 1 1 313.9 720.0' fill='none' stroke='#2f6f9e' stroke-width='6'/><path d='M 313.9 720.0 A 120 120 0 0 1 243.1 775.4' fill='none' stroke='#c0522d' stroke-width='6'/><path d='M 176.9 775.4 A 120 120 0 0 1 106.1 720.0' fill='none' stroke='#c0522d' stroke-width='6'/><path d='M 243.1 775.4 A 120 120 0 0 1 176.9 775.4' fill='none' stroke='#14171b' stroke-width='6'/><text x='210.0' y='822.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#14171b' text-anchor='middle' font-weight='600'>ports - untouched</text><text x='210.0' y='526.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#2f6f9e' text-anchor='middle' font-weight='700'>INTAKE  az 60-300</text><text x='86.0' y='764.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#c0522d' text-anchor='end' font-weight='700'>EXHAUST</text><text x='334.0' y='764.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#c0522d' text-anchor='start' font-weight='700'>EXHAUST</text><line x1='74.7' y1='610.7' x2='92.5' y2='617.2' stroke='#2f6f9e' stroke-width='2' marker-end='url(#fc)'/><line x1='117.4' y1='549.7' x2='129.7' y2='564.2' stroke='#2f6f9e' stroke-width='2' marker-end='url(#fc)'/><line x1='185.0' y1='518.2' x2='188.3' y2='536.9' stroke='#2f6f9e' stroke-width='2' marker-end='url(#fc)'/><line x1='259.3' y1='524.7' x2='252.8' y2='542.5' stroke='#2f6f9e' stroke-width='2' marker-end='url(#fc)'/><line x1='320.3' y1='567.4' x2='305.8' y2='579.7' stroke='#2f6f9e' stroke-width='2' marker-end='url(#fc)'/><line x1='351.8' y1='635.0' x2='333.1' y2='638.3' stroke='#2f6f9e' stroke-width='2' marker-end='url(#fc)'/><line x1='351.8' y1='685.0' x2='333.1' y2='681.7' stroke='#2f6f9e' stroke-width='2' marker-end='url(#fc)'/><line x1='74.7' y1='709.3' x2='92.5' y2='702.8' stroke='#2f6f9e' stroke-width='2' marker-end='url(#fc)'/><line x1='318.3' y1='722.5' x2='334.7' y2='732.0' stroke='#c0522d' stroke-width='2' marker-end='url(#fw)'/><line x1='302.9' y1='743.6' x2='317.0' y2='756.4' stroke='#c0522d' stroke-width='2' marker-end='url(#fw)'/><line x1='283.5' y1='761.1' x2='294.6' y2='776.5' stroke='#c0522d' stroke-width='2' marker-end='url(#fw)'/><line x1='136.5' y1='761.1' x2='125.4' y2='776.5' stroke='#c0522d' stroke-width='2' marker-end='url(#fw)'/><line x1='117.1' y1='743.6' x2='103.0' y2='756.4' stroke='#c0522d' stroke-width='2' marker-end='url(#fw)'/><line x1='101.7' y1='722.5' x2='85.3' y2='732.0' stroke='#c0522d' stroke-width='2' marker-end='url(#fw)'/><rect x='400' y='546' width='4' height='40' fill='#2f6f9e'/><text x='414.0' y='560.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#14171b' text-anchor='start' font-weight='700'>Intake</text><text x='510.0' y='560.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>az 60-300, front and sides</text><text x='414.0' y='578.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#2f6f9e' text-anchor='start' font-weight='400'>80 openings at 1.8 x 4.5 mm = 648 mm2</text><rect x='400' y='600' width='4' height='40' fill='#14171b'/><text x='414.0' y='614.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#14171b' text-anchor='start' font-weight='700'>Port face</text><text x='510.0' y='614.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>az 344-16</text><text x='414.0' y='632.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#14171b' text-anchor='start' font-weight='400'>plain, no openings - the arc the sockets need</text><rect x='400' y='654' width='4' height='40' fill='#c0522d'/><text x='414.0' y='668.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#14171b' text-anchor='start' font-weight='700'>Exhaust</text><text x='510.0' y='668.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>az 16-60 and 300-344</text><text x='414.0' y='686.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#c0522d' text-anchor='start' font-weight='400'>29 openings = 235 mm2, plus 165 mm2 down through the pad</text><rect x='400' y='708' width='4' height='40' fill='#2e7d4f'/><text x='414.0' y='722.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#14171b' text-anchor='start' font-weight='700'>Symmetry</text><text x='510.0' y='722.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>mirrored about the front-to-back centreline</text><text x='414.0' y='740.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#2e7d4f' text-anchor='start' font-weight='400'>the two side views are now identical by construction</text><rect x='400' y='762' width='4' height='40' fill='#2e7d4f'/><text x='414.0' y='776.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#14171b' text-anchor='start' font-weight='700'>Separation</text><text x='510.0' y='776.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6f7680' text-anchor='start' font-weight='400'>nearest intake to nearest exhaust opening</text><text x='414.0' y='794.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#2e7d4f' text-anchor='start' font-weight='400'>about 46 mm apart - enough at a 10-15 K rise</text><text x='30.0' y='860.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' fill='#14171b' text-anchor='start' font-weight='600'>The ring ends up slotted uniformly all the way round except across the port face, so there are no blind openings anywhere.</text></svg>