<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='900' viewBox='0 0 1000 900'><rect width='1000' height='900' fill='#ffffff'/><defs><marker id='fc' markerWidth='7' markerHeight='7' refX='5.5' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#2f6f9e'/></marker><marker id='fw' markerWidth='7' markerHeight='7' refX='5.5' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#c0522d'/></marker></defs><text x='30.0' y='42.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='21' fill='#14171b' text-anchor='start' font-weight='600'>Which way should the fins run, and where can the air get out?</text><text x='30.0' y='66.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#6f7680' text-anchor='start' font-weight='400'>Fins do not create flow - they only guide it. The flow direction is fixed by where the openings are, and the fins have to follow it.</text><text x='30.0' y='84.0' font-family='Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12.5' fill='#6f7680' text-anchor='start' font-weight='400'>Front of the dial is at the top of each circle. Figures are the resistance at 1.0 litre per second.</text><circle cx='180' cy='230' r='98' fill='#dfe3e7' stroke='#98a1a9' stroke-width='2'/><circle cx='180' cy='230' r='82' fill='#ece8de' stroke='#b9b09b' stroke-width='1'/><line x1='198.0' y1='230.0' x2='262.0' y2='230.0' stroke='#a89f8a' stroke-width='2'/><line x1='197.5' y1='234.0' x2='259.9' y2='248.2' stroke='#a89f8a' stroke-width='2'/><line x1='196.2' y1='237.8' x2='253.9' y2='265.6' stroke='#a89f8a' stroke-width='2'/><line x1='194.1' y1='241.2' x2='244.1' y2='281.1' stroke='#a89f8a' stroke-width='2'/><line x1='191.2' y1='244.1' x2='231.1' y2='294.1' stroke='#a89f8a' stroke-width='2'/><line x1='187.8' y1='246.2' x2='215.6' y2='303.9' stroke='#a89f8a' stroke-width='2'/><line x1='184.0' y1='247.5' x2='198.2' y2='309.9' stroke='#a89f8a' stroke-width=